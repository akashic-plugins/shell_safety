name: plugin-api-v3

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  composition-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kachofugetsu09/akashic-agent
          ref: 6c8f8acda54d3c893dd11f1818d83d0a1bb01a85
          path: .akashic-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .akashic-core/requirements.txt
      - name: Install pinned Core dependencies
        run: python -m pip install -r .akashic-core/requirements.txt pytest pytest-asyncio
      - name: Verify Shell Safety v3 behavior
        env:
          AKASHIC_AGENT_ROOT: .akashic-core
          PYTHONPATH: .akashic-core:${{ github.workspace }}/.akashic-core/sdk/python/src
        run: python -m pytest -q tests/
